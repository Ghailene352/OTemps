security:
    # Hasher pour l'entité Utilisateurs
    password_hashers:
        App\Entity\Utilisateurs:
            algorithm: auto

    # Utilisation de la table Utilisateurs
    providers:
        app_user_provider:
            entity:
                class: App\Entity\Utilisateurs
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        main:
            lazy: true
            provider: app_user_provider
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
            logout:
                path: app_logout
                # where to redirect after logout
                # target: app_any_route

    access_control:
        - { path: ^/admin, roles: ROLE_ADMIN }
        - { path: ^/profile, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            App\Entity\Utilisateurs:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
